name: Release Mac launcher

# Rebuilds McGoverner.app whenever the launcher itself changes and republishes
# it to a rolling "launcher-latest" release. The .app only clones/pulls
# REPO_BRANCH (packaging/launch.sh) at runtime — it doesn't bundle the app's
# actual code — so this only needs to run when the launcher mechanism changes,
# not on every commit.
on:
  push:
    branches: [main]
    paths: ["packaging/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build McGoverner.app
        run: |
          cd packaging
          ./build_app.sh

      - name: Zip app bundle
        run: |
          cd packaging
          ditto -c -k --keepParent McGoverner.app McGoverner.app.zip

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: McGoverner Launchers
          make_latest: "true"
          files: packaging/McGoverner.app.zip
          # See release-windows-launcher.yml for why body isn't set here -
          # the two workflows share this release tag and neither should
          # clobber the notes the other (or a manual edit) already wrote.
