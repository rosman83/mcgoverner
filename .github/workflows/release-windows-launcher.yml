name: Release Windows launcher

# Zips the Windows launcher and publishes it to the same rolling release the
# Mac launcher uses. Runs on push to packaging/windows/** or run.ps1 - the
# launcher only downloads the branch's code at runtime, it doesn't bundle it,
# so this doesn't need to run on every commit.
on:
  push:
    branches: [main]
    paths: ["packaging/windows/**", "run.ps1"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the launcher (fallback for anyone who'd rather not run an installer)
        shell: pwsh
        run: Compress-Archive -Path packaging\windows\McGoverner.bat,packaging\windows\launch.ps1 -DestinationPath packaging\windows\McGoverner-Windows.zip -Force

      - name: Build the installer (Inno Setup ships preinstalled on windows-latest)
        shell: pwsh
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\McGoverner.iss

      - name: Publish to the shared launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: McGoverner Launchers
          make_latest: "true"
          files: |
            packaging/windows/McGovernerSetup.exe
            packaging/windows/McGoverner-Windows.zip
          # No `body:` here on purpose - this and the Mac workflow both publish
          # to the same release tag, and omitting body leaves whatever's
          # already there untouched instead of one workflow clobbering the
          # other's notes on every run.
